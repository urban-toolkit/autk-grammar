name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'tmp/**']

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, and schema
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Build and typecheck
        run: make build

      # Before-run only (never merged): every check runs, and each unit file on its own, so each failure shows.
      - name: Validate gallery specs against the JSON Schema
        if: always()
        run: npm run test:schema

      - name: Unit tests
        if: always()
        run: |
          status=0
          for file in tests/unit/*.mts; do
            echo "::group::$file"
            npx tsx "$file" || { echo "FAILED: $file"; status=1; }
            echo "::endgroup::"
          done
          exit $status
